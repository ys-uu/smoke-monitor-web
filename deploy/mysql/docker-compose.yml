# 抽烟检测监控系统 · 专用 MySQL 8.0（团队开发 / 演示部署）
# 设计要点：
# 1) 容器名、数据卷、compose 项目网络独立，与其他工程的数据库容器互不影响；
# 2) 端口仅绑定 127.0.0.1，不对局域网暴露；
# 3) 启动（工程根执行）：
#    docker compose -f deploy/mysql/docker-compose.yml --env-file deploy/mysql/.env up -d
# 4) 停止但保留数据：docker compose -f deploy/mysql/docker-compose.yml stop
#    删除容器切勿随意加 -v（-v 会一并删除命名数据卷 smoke_mysql_data，事件数据丢失）。
name: smoke-detection

services:
  smoke-mysql:
    image: mysql:8.0                      # 首次启动若本地无镜像会自动拉取
    container_name: smoke-mysql
    restart: unless-stopped               # 若不希望随 Docker 自启，可改为 "no"
    ports:
      # 容器内 MySQL 固定监听 3306；宿主机端口由 .env 的 SMOKE_MYSQL_HOST_PORT 控制（默认 3307）
      # 若启动报端口占用，修改 .env 的 SMOKE_MYSQL_HOST_PORT 为其他空闲端口即可。
      - "127.0.0.1:${SMOKE_MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${SMOKE_MYSQL_ROOT_PWD}
      MYSQL_DATABASE: ${SMOKE_MYSQL_DATABASE:-smoke_detection}
      MYSQL_USER: ${SMOKE_MYSQL_USER:-smoke}
      MYSQL_PASSWORD: ${SMOKE_MYSQL_APP_PWD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=128M    # 开发环境小负载，限制 MySQL 内存占用
    volumes:
      - smoke_mysql_data:/var/lib/mysql
    healthcheck:
      # 容器内连 3306 做 ping；compose 会把 ${...} 渲染为 .env 中的 root 密码
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${SMOKE_MYSQL_ROOT_PWD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  smoke_mysql_data:
    name: smoke_mysql_data
